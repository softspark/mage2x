name: Publish
on:
  push:
    tags: ['v*']

# Publish only. Every gate ran locally in scripts/release.sh before this tag
# existed; nothing here re-runs them. See kb/procedures/sop-release.md.

# Default to read-only; the publish job elevates to exactly what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # required for --provenance (OIDC attestation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@softspark'

      # Tagging the wrong commit is easy and invisible until someone installs
      # the result.
      - name: Tag matches package.json
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$PKG" = "$TAG" ] || { echo "::error::package.json is $PKG but the tag is $TAG"; exit 1; }

      # Public npm. Provenance is mandatory here (Golden Rule 8) and works only
      # because the package is published with public access; the private
      # GitHub Packages phase could not carry it. --ignore-scripts costs nothing
      # since the package ships no lifecycle scripts, and closes a supply-chain
      # hole at publish time. dist/ is committed and checked by the release
      # script, so nothing is built here.
      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Third-party action pinned to a full commit SHA (supply-chain hardening);
      # Dependabot (github-actions) keeps the SHA current.
      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
